<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="theme-color" content="#A82B3A" />
  <title>הפקה · ברונט וגיא</title>

  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%23A82B3A'/%3E%3Cpath d='M50 76C50 76 26 61 26 43C26 34 32 29 39 29C44 29 48 32 50 36C52 32 56 29 61 29C68 29 74 34 74 43C74 61 50 76 50 76Z' fill='%23FFF6F0'/%3E%3C/svg%3E" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <style>
    :root {
      --wine: #A82B3A;
      --wine-deep: #83202D;
      --ink: #2A2422;
      --muted: #7A6F6B;
      --bg: #F5F0ED;
      --card: #FFFFFF;
      --line: #E7DED9;
      --chip: #F1E7E4;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      font-family: 'Assistant', 'Segoe UI', system-ui, sans-serif;
      background: var(--bg);
      color: var(--ink);
      line-height: 1.6;
      min-height: 100dvh;
      -webkit-font-smoothing: antialiased;
    }

    /* ---------- LOCK SCREEN ---------- */
    .lock {
      position: fixed; inset: 0; z-index: 20;
      background: linear-gradient(160deg, var(--wine), var(--wine-deep));
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: 2rem 1.5rem; text-align: center; color: #FFF6F0;
    }
    .lock.hidden { display: none; }
    .lock .emblem { width: 60px; height: 60px; margin-bottom: 1.1rem; }
    .lock h1 { font-size: 1.7rem; font-weight: 700; letter-spacing: 0.01em; }
    .lock .sub { opacity: 0.85; margin-bottom: 2rem; font-size: 1.05rem; }
    .lock form { width: 100%; max-width: 320px; display: flex; flex-direction: column; gap: 0.8rem; }
    .lock input {
      font-family: inherit; font-size: 1.15rem; text-align: center; letter-spacing: 0.35em;
      padding: 0.9rem 1rem; border: none; border-radius: 14px; background: #FFF6F0; color: var(--ink);
      width: 100%;
    }
    .lock input::placeholder { letter-spacing: normal; color: #B7A9A4; }
    .lock button {
      font-family: inherit; font-size: 1.15rem; font-weight: 700; color: var(--wine);
      background: #FFF6F0; border: none; border-radius: 999px; padding: 0.95rem; cursor: pointer;
    }
    .lock button:active { transform: scale(0.98); }
    .lock .err { min-height: 1.4rem; font-size: 0.98rem; color: #FFD9D3; font-weight: 600; }

    /* ---------- APP SHELL ---------- */
    .app { display: none; padding-bottom: 3rem; }
    .app.show { display: block; }

    .topbar {
      position: sticky; top: 0; z-index: 10;
      background: var(--wine); color: #FFF6F0;
      padding: max(0.7rem, env(safe-area-inset-top)) 1rem 0.7rem;
      box-shadow: 0 2px 10px rgba(120, 20, 30, 0.18);
    }
    .topbar .title { text-align: center; font-weight: 700; font-size: 1.18rem; line-height: 1.2; margin: 0 0 0.28rem; }
    .topbar .title-sub { text-align: center; font-size: 0.83rem; font-weight: 500; line-height: 1.3; opacity: 0.9; margin: 0 0 0.75rem; }
    .tabs { display: flex; background: rgba(255, 246, 240, 0.16); border-radius: 999px; padding: 4px; }
    .tabs button {
      flex: 1; font-family: inherit; font-size: 1.02rem; font-weight: 700; color: #FFF6F0;
      background: transparent; border: none; border-radius: 999px; padding: 0.6rem; cursor: pointer;
    }
    .tabs button.active { background: #FFF6F0; color: var(--wine); }

    /* sticky sub-header (filter / search) */
    .subbar { position: sticky; top: 0; z-index: 9; background: var(--bg); padding: 0.8rem 1rem 0.5rem; }
    .app .topbar + * .subbar, .view .subbar { top: 96px; }

    .helper { font-size: 0.9rem; color: var(--muted); margin: 0 0.15rem 0.6rem; }

    .chips { display: flex; gap: 0.5rem; overflow-x: auto; padding-bottom: 0.4rem; scrollbar-width: none; }
    .chips::-webkit-scrollbar { display: none; }
    .chip {
      flex: 0 0 auto; font-family: inherit; font-size: 0.95rem; font-weight: 600;
      background: var(--card); color: var(--ink); border: 1px solid var(--line);
      border-radius: 999px; padding: 0.5rem 0.95rem; cursor: pointer; white-space: nowrap;
    }
    .chip .role { color: var(--muted); font-weight: 600; }
    .chip.active { background: var(--wine); color: #FFF6F0; border-color: var(--wine); }
    .chip.active .role { color: rgba(255, 246, 240, 0.8); }

    .search {
      width: 100%; font-family: inherit; font-size: 1.05rem; padding: 0.8rem 1rem;
      border: 1px solid var(--line); border-radius: 14px; background: var(--card); color: var(--ink);
    }

    .list { padding: 0.3rem 1rem 0; }
    .empty { text-align: center; color: var(--muted); padding: 2.5rem 1rem; }

    /* ---------- SCHEDULE CARD (compact) ---------- */
    .ev {
      background: var(--card); border: 1px solid var(--line); border-radius: 12px;
      padding: 0.55rem 0.7rem; margin-bottom: 0.5rem;
    }
    .ev-top { display: flex; align-items: center; gap: 0.55rem; }
    /* time = compact solid pill, always at the row start; never reads like a supplier tag */
    .ev-time {
      flex: 0 0 auto; min-width: 3.5rem; text-align: center;
      background: var(--wine); color: #FFF6F0;
      font-weight: 700; font-size: 1.05rem; line-height: 1.3; letter-spacing: 0.01em;
      border-radius: 8px; padding: 0.12rem 0.5rem;
    }
    .ev-time.pre { font-size: 0.72rem; padding: 0.18rem 0.5rem; line-height: 1.15; }
    .ev-title { flex: 1; min-width: 0; font-weight: 700; font-size: 1.05rem; line-height: 1.25; }
    /* location & people on one wrapping line */
    .ev-meta { display: flex; flex-wrap: wrap; gap: 0.05rem 0.9rem; margin-top: 0.3rem; padding-inline-start: 0.1rem; }
    .ev-metarow { font-size: 0.85rem; color: var(--muted); line-height: 1.35; }
    .ev-metarow b { color: var(--ink); font-weight: 600; }
    .ev-vendors { display: flex; flex-wrap: wrap; gap: 0.3rem; margin-top: 0.4rem; }
    .vtag {
      font-size: 0.8rem; font-weight: 600; background: var(--chip); color: var(--wine-deep);
      border-radius: 999px; padding: 0.18rem 0.55rem; cursor: pointer; border: 1px solid var(--line);
    }
    .vtag::before { content: "☎ "; font-size: 0.8em; opacity: 0.75; }
    .vtag:active { transform: scale(0.96); }
    .vtag.hit { background: var(--wine); color: #FFF6F0; border-color: var(--wine); }
    .ev-notes {
      margin-top: 0.45rem; padding-top: 0.4rem; border-top: 1px dashed var(--line);
      font-size: 0.92rem; color: var(--ink);
    }
    .ev-notes .n { margin-bottom: 0.5rem; white-space: pre-line; }
    .ev-notes .who { font-weight: 700; color: var(--wine); }
    .ev-notes .n.mine { background: #FBEEDF; border-radius: 8px; padding: 0.3rem 0.5rem; }

    /* ---------- CONTACTS ---------- */
    .cat-h { font-size: 0.9rem; font-weight: 700; color: var(--wine); margin: 1.1rem 0.15rem 0.5rem; letter-spacing: 0.02em; }
    .card {
      display: flex; align-items: center; gap: 0.7rem;
      background: var(--card); border: 1px solid var(--line); border-radius: 13px;
      padding: 0.6rem 0.8rem; margin-bottom: 0.5rem;
    }
    .card-info { flex: 1; min-width: 0; }
    .card .sup { font-weight: 700; font-size: 1.05rem; line-height: 1.25; }
    .card .who { color: var(--muted); font-size: 0.9rem; }
    .card-actions { display: flex; gap: 0.5rem; flex-shrink: 0; }
    .iconbtn {
      width: 44px; height: 44px; border-radius: 12px; display: flex; align-items: center;
      justify-content: center; text-decoration: none; cursor: pointer;
    }
    .iconbtn:active { transform: scale(0.94); }
    .iconbtn svg { width: 22px; height: 22px; }
    .iconbtn.call { background: var(--wine); color: #FFF6F0; }
    .iconbtn.wa { background: #1FA855; color: #E7F8EE; }
    .iconbtn.ig { background: linear-gradient(45deg, #feda75, #fa7e1e, #d62976, #962fbf, #4f5bd5); color: #FFFFFF; }
    .card .none { color: var(--muted); font-size: 0.82rem; font-weight: 600; flex-shrink: 0; }
    .card.manager { border-color: var(--wine); background: #FBEEF1; box-shadow: 0 3px 12px rgba(168, 43, 58, 0.14); }
    .mgr-badge {
      display: inline-block; font-size: 0.74rem; font-weight: 700; color: #FFF6F0;
      background: var(--wine); border-radius: 999px; padding: 0.12rem 0.6rem; margin-bottom: 0.4rem;
    }
    .card.flash { animation: cardflash 1.9s ease; }
    @keyframes cardflash {
      0% { box-shadow: 0 0 0 0 rgba(168, 43, 58, 0); }
      12% { box-shadow: 0 0 0 3px rgba(168, 43, 58, 0.6); background: #FBEFF0; }
      100% { box-shadow: 0 0 0 0 rgba(168, 43, 58, 0); background: var(--card); }
    }

    /* ---------- NOW / NEXT ---------- */
    .ev.past { opacity: 0.5; }
    .ev.now {
      border-color: var(--wine);
      box-shadow: 0 4px 16px rgba(168, 43, 58, 0.20);
    }
    .ev-badge {
      display: inline-block; font-size: 0.72rem; font-weight: 700;
      border-radius: 999px; padding: 0.1rem 0.55rem; margin-bottom: 0.3rem;
      letter-spacing: 0.02em;
    }
    .ev-badge.now { background: var(--wine); color: #FFF6F0; }
    .ev-badge.next { background: var(--chip); color: var(--wine-deep); }

    /* schedule subbar controls */
    .sched-tools { display: flex; align-items: center; gap: 0.5rem; margin-bottom: 0.6rem; }
    .sched-tools .search { flex: 1; }
    .toggle-past {
      flex: 0 0 auto; font-family: inherit; font-size: 0.85rem; font-weight: 600;
      background: var(--card); color: var(--muted); border: 1px solid var(--line);
      border-radius: 999px; padding: 0.55rem 0.8rem; cursor: pointer; white-space: nowrap;
    }
    .toggle-past.on { background: var(--wine); color: #FFF6F0; border-color: var(--wine); }

    /* full-width event-manager (שקד) call bar */
    .mgrbar {
      display: flex; align-items: center; gap: 0.7rem; box-sizing: border-box;
      text-decoration: none; margin: 0.8rem 1rem 0.4rem;
      background: var(--wine); color: #FFF6F0;
      border-radius: 12px; padding: 0.7rem 0.95rem;
      box-shadow: 0 3px 12px rgba(168, 43, 58, 0.18);
    }
    .mgrbar:active { transform: scale(0.99); }
    .mgrbar .mg-ic {
      width: 38px; height: 38px; border-radius: 999px; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      background: #FFF6F0; color: var(--wine);
    }
    .mgrbar .mg-ic svg { width: 20px; height: 20px; }
    .mgrbar .mg-txt { display: flex; flex-direction: column; line-height: 1.2; min-width: 0; }
    .mgrbar .mg-name { font-weight: 700; font-size: 1.08rem; }
    .mgrbar .mg-name .mg-role { font-weight: 500; opacity: 0.85; font-size: 0.9rem; }
    .mgrbar .mg-phone { font-weight: 600; font-size: 0.95rem; opacity: 0.92; letter-spacing: 0.02em; }

    @media (min-width: 620px) {
      .lock form, .list, .subbar, .mgrbar { max-width: 560px; margin-inline: auto; }
    }
  </style>
</head>

    <section class="view" id="view-sched">

      </div>
      <div class="list" id="sched-list"></div>

    <section class="view" id="view-suppliers" style="display:none">
      <div class="subbar">
        <input class="search" id="search" type="search" placeholder="חיפוש ספק, קטגוריה או איש קשר…" aria-label="חיפוש" />
      </div>
      <div class="list" id="suppliers-list"></div>
    </section>

    <section class="view" id="view-family" style="display:none">
      <div class="list" id="family-list" style="padding-top:0.8rem"></div>
    </section>
  </div>

        { name: "PBKDF2", salt, iterations: p.iter || 200000, hash: "SHA-256" },
        baseKey, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
      const buf = await crypto.subtle.decrypt({ name: "AES-GCM", iv }, key, ct);
      return JSON.parse(new TextDecoder().decode(buf));
    }

    /* ---------- unlock flow ---------- */
    async function unlock(password) {
      const data = await decrypt(password, PAYLOAD); // throws on wrong password
      DATA = data;
      // keep unlocked for the session; re-decrypt the live payload on each load (always fresh)
      try { sessionStorage.setItem("hafaka_pw", password); } catch (e) {}
      showApp();
    }

    function showApp() {
      $("lock").classList.add("hidden");
      $("app").classList.add("show");
      // restore hide-past toggle state
      const tbtn = $("toggle-past");
      tbtn.textContent = hidePast ? "הצג הכול" : "הסתר שהסתיימו";
      tbtn.classList.toggle("on", hidePast);
      renderChips();
      renderManagerBar();
      renderSchedule();
      renderSuppliers();
      renderFamily();
      // land on "now" when opening on the schedule (wait for fonts/layout to settle)
      afterLayout(() => scrollToNow(false));
    }

    $("lockForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const pw = $("pw").value.trim();
      $("err").textContent = "";
      if (!pw) return;
      try {
        await unlock(pw);
      } catch (err) {
        $("err").textContent = "סיסמה שגויה, נסו שוב";
        $("pw").value = "";
        $("pw").focus();
      }
    });

    /* ---------- tabs ---------- */
    const VIEWS = { sched: "view-sched", suppliers: "view-suppliers", family: "view-family" };
    const TABS = { sched: "tab-sched", suppliers: "tab-suppliers", family: "tab-family" };
    function switchTab(which) {
      Object.keys(VIEWS).forEach((k) => {
        $(VIEWS[k]).style.display = k === which ? "" : "none";
        $(TABS[k]).classList.toggle("active", k === which);
      });
      localStorage.setItem("hafaka_tab", which);
      window.scrollTo(0, 0);
      if (which === "sched") { markNow(); setTimeout(() => scrollToNow(false), 80); }
    }
    $("tab-sched").addEventListener("click", () => switchTab("sched"));
    $("tab-suppliers").addEventListener("click", () => switchTab("suppliers"));
    $("tab-family").addEventListener("click", () => switchTab("family"));

    /* ---------- schedule ---------- */
    function vendorLabel(key) {
      const v = (DATA.suppliers || []).find((s) => s.key === key);
      return v || { key, role: "", name: key };
    }

    function renderChips() {
      const chips = [{ key: "all", role: "", name: "הכל" }].concat(DATA.suppliers || []);
      $("chips").innerHTML = chips.map((c) => {
        const active = c.key === activeVendor ? " active" : "";
        const label = c.key === "all"
          ? "הכל"
          : `<span class="role">${esc(c.role)}</span> · ${esc(c.name)}`;
        return `<button class="chip${active}" data-key="${esc(c.key)}">${label}</button>`;
      }).join("");
      $("chips").querySelectorAll(".chip").forEach((b) => {
        b.addEventListener("click", () => {
          activeVendor = b.dataset.key;
          localStorage.setItem("hafaka_vendor", activeVendor);
          renderChips();
          renderSchedule();
        });
      });
    }

    function renderNotes(notes, mineKey) {
      // Split "[name] text [name] text" into per-vendor segments.
      const parts = [];
      const re = /\[([^\]]+)\]\s*([^\[]*)/g;
      let m, matched = false;
      while ((m = re.exec(notes))) {
        matched = true;
        parts.push({ who: m[1].trim(), text: m[2].trim() });
      }
      if (!matched) return `<div class="ev-notes"><div class="n">${esc(notes)}</div></div>`;
      const mineName = mineKey && mineKey !== "all" ? vendorLabel(mineKey).key : null;
      const html = parts.map((p) => {
        const mine = mineName && p.who.indexOf(mineName) !== -1 ? " mine" : "";
        return `<div class="n${mine}"><span class="who">${esc(p.who)}:</span> ${esc(p.text)}</div>`;
      }).join("");
      return `<div class="ev-notes">${html}</div>`;
    }

    function rowMatchesQuery(r, q) {
      if (!q) return true;
      const vendorNames = (r.suppliers || [])
        .map((k) => { const v = vendorLabel(k); return `${v.role} ${v.name} ${v.key}`; }).join(" ");
      return [r.activity, r.location, r.who, r.notes, vendorNames]
        .join(" ").toLowerCase().indexOf(q) !== -1;
    }

    function renderSchedule() {
      const q = schedQuery.trim().toLowerCase();
      const rows = (DATA.schedule || []).filter((r) =>
        (activeVendor === "all" ? true : (r.suppliers || []).indexOf(activeVendor) !== -1)
        && rowMatchesQuery(r, q));
      if (!rows.length) {
        $("sched-list").innerHTML = `<div class="empty">${q ? "לא נמצאו תוצאות" : "אין פריטים לספק זה"}</div>`;
        markNow();
        return;
      }
      $("sched-list").innerHTML = rows.map((r) => {
        const ts = parseEventTime(r.time);
        const time = r.time
          ? `<div class="ev-time">${esc(r.time)}</div>`
          : `<div class="ev-time pre">לפני האירוע</div>`;
        let metaHtml = "";
        if (r.location || r.who) {
          metaHtml = `<div class="ev-meta">`;
          if (r.location) metaHtml += `<div class="ev-metarow">📍 <b>${esc(r.location)}</b></div>`;
          if (r.who) metaHtml += `<div class="ev-metarow">👥 <b>${esc(r.who)}</b></div>`;
          metaHtml += `</div>`;
        }
        const vendors = (r.suppliers || []).map((k) => {
          const v = vendorLabel(k);
          const hit = k === activeVendor ? " hit" : "";
          const txt = v.role ? `${v.role} · ${v.name}` : v.name;
          return `<span class="vtag${hit}" data-key="${esc(k)}" role="button" tabindex="0">${esc(txt)}</span>`;
        }).join("");
        const notes = r.notes ? renderNotes(r.notes, activeVendor) : "";
        return `<div class="ev" data-ts="${ts == null ? "" : ts}">
          <div class="ev-badge-slot"></div>
          <div class="ev-top">
            ${time}
            <div class="ev-title">${esc(r.activity)}</div>
          </div>
          ${metaHtml}
          ${vendors ? `<div class="ev-vendors">${vendors}</div>` : ""}
          ${notes}
        </div>`;
      }).join("");
      markNow();
    }

    /* ---------- now / next highlighting ---------- */
    function markNow() {
      const now = getNow();
      const cards = [...document.querySelectorAll("#sched-list .ev")];
      // reset
      cards.forEach((c) => {
        c.classList.remove("now", "next", "past");
        c.style.display = "";
        const slot = c.querySelector(".ev-badge-slot");
        if (slot) slot.innerHTML = "";
      });
      if (!cards.length) return;
      const ts = (c) => { const v = c.getAttribute("data-ts"); return v === "" ? -Infinity : +v; };
      // current = last card whose ts <= now (its ts differs from being purely future)
      let nowIdx = -1;
      for (let i = 0; i < cards.length; i++) { if (ts(cards[i]) <= now) nowIdx = i; }
      cards.forEach((c, i) => {
        if (i < nowIdx) c.classList.add("past");
      });
      const setBadge = (c, cls, text) => {
        c.classList.add(cls);
        const slot = c.querySelector(".ev-badge-slot");
        if (slot) slot.innerHTML = `<span class="ev-badge ${cls}">${text}</span>`;
      };
      if (nowIdx >= 0) {
        setBadge(cards[nowIdx], "now", "▶ עכשיו");
        // mark the following card as the scroll target, but with no visible badge
        if (nowIdx + 1 < cards.length) cards[nowIdx + 1].classList.add("next");
      } else {
        cards[0].classList.add("next"); // everything is still upcoming (scroll target only)
      }
      applyHidePast();
    }

    function applyHidePast() {
      document.querySelectorAll("#sched-list .ev.past").forEach((c) => {
        c.style.display = hidePast ? "none" : "";
      });
    }

    function scrollToNow(smooth) {
      const target = document.querySelector("#sched-list .ev.now")
        || document.querySelector("#sched-list .ev.next");
      if (!target) return;
      const y0 = window.scrollY;
      target.scrollIntoView({ behavior: smooth ? "smooth" : "auto", block: "center" });
      // fallback: some in-app browsers no-op smooth scrolling — force an instant jump if nothing moved
      if (smooth) setTimeout(() => {
        if (Math.abs(window.scrollY - y0) < 4) target.scrollIntoView({ behavior: "auto", block: "center" });
      }, 400);
    }
    // run fn only after fonts have loaded and the layout has painted (stable scroll target)
    function afterLayout(fn) {
      const run = () => requestAnimationFrame(() => requestAnimationFrame(fn));
      if (document.fonts && document.fonts.ready) document.fonts.ready.then(run);
      else setTimeout(run, 350);
    }

    /* ---------- contacts (suppliers + family) ---------- */
    function waLink(phone) {
      const digits = phone.replace(/\D/g, "");
      if (!/^05\d{8}$/.test(digits)) return null; // WhatsApp only for IL mobile
      return "https://wa.me/972" + digits.slice(1);
    }

    // contact name bold on top; company/venue below (hidden for family or when identical)
    function contactCard(c, family) {
      const contact = c.contact || c.supplier || "";
      const company = (!family && c.supplier && c.supplier !== contact) ? c.supplier : "";
      const tel = c.phone ? c.phone.replace(/\s/g, "") : "";
      const wa = c.phone ? waLink(c.phone) : null;
      const isMgr = !family && /מנהל/.test(c.contact || "");
      const ig = c.ig ? "https://instagram.com/" + c.ig : null;
      const btns = [];
      if (tel) btns.push(`<a class="iconbtn call" href="tel:${esc(tel)}" aria-label="התקשרו">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6.6 10.8c1.4 2.8 3.8 5.1 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1C10.4 21 3 13.6 3 4c0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.2.2 2.4.6 3.6.1.4 0 .8-.3 1.1l-2.2 2.1z"/></svg></a>`);
      if (wa) btns.push(`<a class="iconbtn wa" href="${esc(wa)}" target="_blank" rel="noopener" aria-label="וואטסאפ">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a10 10 0 0 0-8.5 15.3L2 22l4.8-1.5A10 10 0 1 0 12 2zm0 18a8 8 0 0 1-4.1-1.1l-.3-.2-2.9.8.8-2.8-.2-.3A8 8 0 1 1 12 20zm4.4-6c-.2-.1-1.4-.7-1.6-.8-.2-.1-.4-.1-.5.1-.2.2-.6.8-.8 1-.1.1-.3.2-.5 0-.2-.1-1-.4-1.9-1.2-.7-.6-1.2-1.4-1.3-1.6-.1-.2 0-.4.1-.5l.4-.4c.1-.1.2-.3.2-.4 0-.1 0-.3-.1-.4l-.7-1.7c-.2-.5-.4-.4-.5-.4h-.5c-.2 0-.4.1-.6.3-.2.2-.8.8-.8 1.9s.8 2.2 1 2.4c.1.2 1.7 2.6 4 3.5 1.5.6 2 .6 2.8.5.5-.1 1.4-.6 1.6-1.1.2-.6.2-1 .1-1.1-.1-.1-.2-.2-.4-.3z"/></svg></a>`);
      if (ig) btns.push(`<a class="iconbtn ig" href="${esc(ig)}" target="_blank" rel="noopener" aria-label="אינסטגרם">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2.2c3.2 0 3.6 0 4.9.1 1.2.1 1.8.3 2.2.4.6.2 1 .5 1.4.9.4.4.7.8.9 1.4.2.4.4 1 .4 2.2.1 1.3.1 1.7.1 4.9s0 3.6-.1 4.9c-.1 1.2-.3 1.8-.4 2.2-.2.6-.5 1-.9 1.4-.4.4-.8.7-1.4.9-.4.2-1 .4-2.2.4-1.3.1-1.7.1-4.9.1s-3.6 0-4.9-.1c-1.2-.1-1.8-.3-2.2-.4-.6-.2-1-.5-1.4-.9-.4-.4-.7-.8-.9-1.4-.2-.4-.4-1-.4-2.2-.1-1.3-.1-1.7-.1-4.9s0-3.6.1-4.9c.1-1.2.3-1.8.4-2.2.2-.6.5-1 .9-1.4.4-.4.8-.7 1.4-.9.4-.2 1-.4 2.2-.4C8.4 2.2 8.8 2.2 12 2.2zm0 1.8c-3.1 0-3.5 0-4.7.1-1.1.1-1.7.2-2.1.4-.5.2-.9.4-1.3.8-.4.4-.6.8-.8 1.3-.2.4-.3 1-.4 2.1-.1 1.2-.1 1.6-.1 4.7s0 3.5.1 4.7c.1 1.1.2 1.7.4 2.1.2.5.4.9.8 1.3.4.4.8.6 1.3.8.4.2 1 .3 2.1.4 1.2.1 1.6.1 4.7.1s3.5 0 4.7-.1c1.1-.1 1.7-.2 2.1-.4.5-.2.9-.4 1.3-.8.4-.4.6-.8.8-1.3.2-.4.3-1 .4-2.1.1-1.2.1-1.6.1-4.7s0-3.5-.1-4.7c-.1-1.1-.2-1.7-.4-2.1-.2-.5-.4-.9-.8-1.3-.4-.4-.8-.6-1.3-.8-.4-.2-1-.3-2.1-.4-1.2-.1-1.6-.1-4.7-.1zm0 3.1a4.9 4.9 0 1 1 0 9.8 4.9 4.9 0 0 1 0-9.8zm0 1.8a3.1 3.1 0 1 0 0 6.2 3.1 3.1 0 0 0 0-6.2zm5.1-.5a1.15 1.15 0 1 1 0 2.3 1.15 1.15 0 0 1 0-2.3z"/></svg></a>`);
      const actions = btns.length
        ? `<div class="card-actions">${btns.join("")}</div>`
        : `<div class="none">טרם עודכן</div>`;
      return `<div class="card${isMgr ? " manager" : ""}" data-supplier="${esc(c.supplier)}">
        <div class="card-info">
          ${isMgr ? `<div class="mgr-badge">⭐ מנהל האירוע</div>` : ""}
          <div class="sup">${esc(contact)}</div>
          ${company ? `<div class="who">${esc(company)}</div>` : ""}
        </div>
        ${actions}
      </div>`;
    }

    function renderSuppliers(query) {
      const q = (query || "").trim().toLowerCase();
      let list = (DATA.contacts || []).filter((c) => c.category !== "זוג");
      if (q) list = list.filter((c) =>
        [c.category, c.supplier, c.contact].join(" ").toLowerCase().indexOf(q) !== -1);
      if (!list.length) { $("suppliers-list").innerHTML = `<div class="empty">לא נמצאו תוצאות</div>`; return; }
      let html = "", lastCat = null;
      list.forEach((c) => {
        if (c.category !== lastCat) { html += `<div class="cat-h">${esc(c.category)}</div>`; lastCat = c.category; }
        html += contactCard(c, false);
      });
      $("suppliers-list").innerHTML = html;
    }

    function renderFamily() {
      const fam = (DATA.contacts || []).filter((c) => c.category === "זוג");
      const isCouple = (c) => c.supplier === "חתן" || c.supplier === "כלה";
      const couple = fam.filter(isCouple);
      const rels = fam.filter((c) => !isCouple(c));
      let html = "";
      if (couple.length) { html += `<div class="cat-h">הזוג</div>`; couple.forEach((c) => (html += contactCard(c, true))); }
      if (rels.length) { html += `<div class="cat-h">משפחה</div>`; rels.forEach((c) => (html += contactCard(c, true))); }
      $("family-list").innerHTML = html || `<div class="empty">—</div>`;
    }
    $("search").addEventListener("input", (e) => renderSuppliers(e.target.value));

    // Tapping a vendor tag on a schedule card jumps to that contact in ספקים.
    function gotoContact(key) {
      const name = vendorLabel(key).name;
      switchTab("suppliers");
      const s = $("search");
      if (s.value) { s.value = ""; renderSuppliers(); }
      setTimeout(() => {
        const card = [...document.querySelectorAll("#suppliers-list .card")]
          .find((c) => c.dataset.supplier === name);
        if (card) {
          card.scrollIntoView({ behavior: "smooth", block: "center" });
          card.classList.remove("flash");
          void card.offsetWidth;
          card.classList.add("flash");
        }
      }, 60);
    }
    $("sched-list").addEventListener("click", (e) => {
      const tag = e.target.closest(".vtag[data-key]");
      if (tag) gotoContact(tag.dataset.key);
    });

    /* ---------- coordination shortcuts ---------- */
    const PHONE_SVG = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M6.6 10.8c1.4 2.8 3.8 5.1 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1C10.4 21 3 13.6 3 4c0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.2.2 2.4.6 3.6.1.4 0 .8-.3 1.1l-2.2 2.1z"/></svg>';
    const telHref = (phone) => "tel:" + (phone || "").replace(/\s/g, "");
    function getManager() { return (DATA.contacts || []).find((c) => /מנהל/.test(c.contact || "")); }
    function shortName(s) { return (s || "").replace(/\s*\([^)]*\)\s*/g, "").trim(); }
    function fmtPhone(p) {
      const d = (p || "").replace(/\D/g, "");
      if (/^0\d{9}$/.test(d)) return d.slice(0, 3) + "-" + d.slice(3, 6) + "-" + d.slice(6); // 05x-xxx-xxxx
      return p || "";
    }

    // full-width event-manager (שקד) call bar
    function renderManagerBar() {
      const bar = $("mgrbar");
      const mgr = getManager();
      if (!mgr || !mgr.phone) { bar.style.display = "none"; return; }
      bar.style.display = "";
      bar.setAttribute("href", telHref(mgr.phone));
      bar.innerHTML = `<span class="mg-ic">${PHONE_SVG}</span>
        <span class="mg-txt">
          <span class="mg-name">${esc(shortName(mgr.contact))} <span class="mg-role">· מנהל האירוע</span></span>
          <span class="mg-phone">${esc(fmtPhone(mgr.phone))}</span>
        </span>`;
    }

    $("sched-search").addEventListener("input", (e) => { schedQuery = e.target.value; renderSchedule(); });

    $("toggle-past").addEventListener("click", () => {
      hidePast = !hidePast;
      localStorage.setItem("hafaka_hidepast", hidePast ? "1" : "0");
      const btn = $("toggle-past");
      btn.textContent = hidePast ? "הצג הכול" : "הסתר שהסתיימו";
      btn.classList.toggle("on", hidePast);
      applyHidePast();
    });

    // advance the now/next highlight while the app is open
    setInterval(() => { if ($("app").classList.contains("show")) markNow(); }, 30000);

    /* ---------- boot: restore session if already unlocked ---------- */
    (async function boot() {
      let pw = null;
      try { pw = sessionStorage.getItem("hafaka_pw"); } catch (e) {}
      if (pw) {
        try {
          DATA = await decrypt(pw, PAYLOAD); // re-decrypt the CURRENT payload -> always latest data
          showApp();
          const t = localStorage.getItem("hafaka_tab");
          if (t === "suppliers" || t === "family") switchTab(t);
          return;
        } catch (e) {
          try { sessionStorage.removeItem("hafaka_pw"); } catch (e2) {}
        }
      }
      $("pw").focus();
    })();
  </script>
</body>
</html>
