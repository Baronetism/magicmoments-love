<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="theme-color" content="#A82B3A" />
  <title>הפקה · ברונט וגיא</title>

  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%23A82B3A'/%3E%3Cpath d='M50 76C50 76 26 61 26 43C26 34 32 29 39 29C44 29 48 32 50 36C52 32 56 29 61 29C68 29 74 34 74 43C74 61 50 76 50 76Z' fill='%23FFF6F0'/%3E%3C/svg%3E" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <style>
    :root {
      --wine: #A82B3A;
      --wine-deep: #83202D;
      --ink: #2A2422;
      --muted: #7A6F6B;
      --bg: #F5F0ED;
      --card: #FFFFFF;
      --line: #E7DED9;
      --chip: #F1E7E4;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      font-family: 'Assistant', 'Segoe UI', system-ui, sans-serif;
      background: var(--bg);
      color: var(--ink);
      line-height: 1.6;
      min-height: 100dvh;
      -webkit-font-smoothing: antialiased;
    }

    /* ---------- LOCK SCREEN ---------- */
    .lock {
      position: fixed; inset: 0; z-index: 20;
      background: linear-gradient(160deg, var(--wine), var(--wine-deep));
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: 2rem 1.5rem; text-align: center; color: #FFF6F0;
    }
    .lock.hidden { display: none; }
    .lock .emblem { width: 60px; height: 60px; margin-bottom: 1.1rem; }
    .lock h1 { font-size: 1.7rem; font-weight: 700; letter-spacing: 0.01em; }
    .lock .sub { opacity: 0.85; margin-bottom: 2rem; font-size: 1.05rem; }
    .lock form { width: 100%; max-width: 320px; display: flex; flex-direction: column; gap: 0.8rem; }
    .lock input {
      font-family: inherit; font-size: 1.15rem; text-align: center; letter-spacing: 0.35em;
      padding: 0.9rem 1rem; border: none; border-radius: 14px; background: #FFF6F0; color: var(--ink);
      width: 100%;
    }
    .lock input::placeholder { letter-spacing: normal; color: #B7A9A4; }
    .lock button {
      font-family: inherit; font-size: 1.15rem; font-weight: 700; color: var(--wine);
      background: #FFF6F0; border: none; border-radius: 999px; padding: 0.95rem; cursor: pointer;
    }
    .lock button:active { transform: scale(0.98); }
    .lock .err { min-height: 1.4rem; font-size: 0.98rem; color: #FFD9D3; font-weight: 600; }

    /* ---------- APP SHELL ---------- */
    .app { display: none; padding-bottom: 3rem; }
    .app.show { display: block; }

    .topbar {
      position: sticky; top: 0; z-index: 10;
      background: var(--wine); color: #FFF6F0;
      padding: max(0.7rem, env(safe-area-inset-top)) 1rem 0.7rem;
      box-shadow: 0 2px 10px rgba(120, 20, 30, 0.18);
    }
    .topbar .title { text-align: center; font-weight: 700; font-size: 1.18rem; line-height: 1.2; margin: 0 0 0.28rem; }
    .topbar .title-sub { text-align: center; font-size: 0.83rem; font-weight: 500; line-height: 1.3; opacity: 0.9; margin: 0 0 0.75rem; }
    .tabs { display: flex; background: rgba(255, 246, 240, 0.16); border-radius: 999px; padding: 4px; }
    .tabs button {
      flex: 1; font-family: inherit; font-size: 1.02rem; font-weight: 700; color: #FFF6F0;
      background: transparent; border: none; border-radius: 999px; padding: 0.6rem; cursor: pointer;
    }
    .tabs button.active { background: #FFF6F0; color: var(--wine); }

    /* sticky sub-header (filter / search) */
    .subbar { position: sticky; top: 0; z-index: 9; background: var(--bg); padding: 0.8rem 1rem 0.5rem; }
    .app .topbar + * .subbar, .view .subbar { top: 96px; }

    .helper { font-size: 0.9rem; color: var(--muted); margin: 0 0.15rem 0.6rem; }

    .chips { display: flex; gap: 0.5rem; overflow-x: auto; padding-bottom: 0.4rem; scrollbar-width: none; }
    .chips::-webkit-scrollbar { display: none; }
    .chip {
      flex: 0 0 auto; font-family: inherit; font-size: 0.95rem; font-weight: 600;
      background: var(--card); color: var(--ink); border: 1px solid var(--line);
      border-radius: 999px; padding: 0.5rem 0.95rem; cursor: pointer; white-space: nowrap;
    }
    .chip .role { color: var(--muted); font-weight: 600; }
    .chip.active { background: var(--wine); color: #FFF6F0; border-color: var(--wine); }
    .chip.active .role { color: rgba(255, 246, 240, 0.8); }

    .search {
      width: 100%; font-family: inherit; font-size: 1.05rem; padding: 0.8rem 1rem;
      border: 1px solid var(--line); border-radius: 14px; background: var(--card); color: var(--ink);
    }

    .list { padding: 0.3rem 1rem 0; }
    .empty { text-align: center; color: var(--muted); padding: 2.5rem 1rem; }

    /* ---------- SCHEDULE CARD ---------- */
    .ev {
      background: var(--card); border: 1px solid var(--line); border-radius: 16px;
      padding: 0.95rem 1rem; margin-bottom: 0.8rem;
    }
    .ev-head { display: flex; align-items: flex-start; gap: 0.7rem; margin-bottom: 0.6rem; }
    .ev-time {
      flex: 0 0 auto; font-weight: 700; font-size: 1.18rem; color: var(--wine);
      background: var(--chip); border-radius: 10px; padding: 0.3rem 0.5rem; min-width: 3.8rem;
      text-align: center; line-height: 1.15;
    }
    .ev-time.pre { font-size: 0.82rem; }
    .ev-main { flex: 1; min-width: 0; }
    .ev-title { font-weight: 700; font-size: 1.16rem; line-height: 1.3; }
    .ev-sub { font-size: 0.86rem; color: var(--muted); margin-top: 0.2rem; line-height: 1.45; }
    .ev-vendors { display: flex; flex-wrap: wrap; gap: 0.35rem; }
    .vtag {
      font-size: 0.85rem; font-weight: 600; background: var(--chip); color: var(--wine-deep);
      border-radius: 999px; padding: 0.25rem 0.65rem; cursor: pointer; border: 1px solid transparent;
    }
    .vtag::before { content: "☎ "; font-size: 0.8em; opacity: 0.75; }
    .vtag:active { transform: scale(0.96); }
    .vtag.hit { background: var(--wine); color: #FFF6F0; }
    .ev-notes {
      margin-top: 0.65rem; padding-top: 0.6rem; border-top: 1px dashed var(--line);
      font-size: 0.98rem; color: var(--ink);
    }
    .ev-notes .n { margin-bottom: 0.5rem; white-space: pre-line; }
    .ev-notes .who { font-weight: 700; color: var(--wine); }
    .ev-notes .n.mine { background: #FBEEDF; border-radius: 8px; padding: 0.3rem 0.5rem; }

    /* ---------- CONTACTS ---------- */
    .cat-h { font-size: 0.9rem; font-weight: 700; color: var(--wine); margin: 1.1rem 0.15rem 0.5rem; letter-spacing: 0.02em; }
    .card {
      background: var(--card); border: 1px solid var(--line); border-radius: 16px;
      padding: 0.85rem 1rem; margin-bottom: 0.7rem;
    }
    .card .sup { font-weight: 700; font-size: 1.1rem; }
    .card .who { color: var(--muted); font-size: 0.98rem; margin-bottom: 0.6rem; }
    .card .actions { display: flex; gap: 0.55rem; }
    .btn {
      flex: 1; display: inline-flex; align-items: center; justify-content: center; gap: 0.4rem;
      font-family: inherit; font-size: 1.02rem; font-weight: 700; text-decoration: none;
      border-radius: 12px; padding: 0.7rem; cursor: pointer;
    }
    .btn svg { width: 19px; height: 19px; }
    .btn-call { background: var(--wine); color: #FFF6F0; }
    .btn-wa { background: #E6F4EA; color: #128C4B; }
    .card .none { color: var(--muted); font-size: 0.95rem; font-weight: 600; }
    .card.manager { border-color: var(--wine); background: #FBEEF1; box-shadow: 0 3px 12px rgba(168, 43, 58, 0.14); }
    .mgr-badge {
      display: inline-block; font-size: 0.74rem; font-weight: 700; color: #FFF6F0;
      background: var(--wine); border-radius: 999px; padding: 0.12rem 0.6rem; margin-bottom: 0.4rem;
    }
    .card.flash { animation: cardflash 1.9s ease; }
    @keyframes cardflash {
      0% { box-shadow: 0 0 0 0 rgba(168, 43, 58, 0); }
      12% { box-shadow: 0 0 0 3px rgba(168, 43, 58, 0.6); background: #FBEFF0; }
      100% { box-shadow: 0 0 0 0 rgba(168, 43, 58, 0); background: var(--card); }
    }

    @media (min-width: 620px) {
      .lock form, .list, .subbar { max-width: 560px; margin-inline: auto; }
    }
  </style>
</head>
<body>

  <!-- LOCK -->
  <div class="lock" id="lock">
    <svg class="emblem" viewBox="0 0 100 100" aria-hidden="true">
      <circle cx="50" cy="50" r="47" stroke="#FFF6F0" stroke-width="2.5" fill="none"/>
      <path d="M50 71C50 71 30 59 30 44.5C30 37.5 35.4 33 41 33C45 33 48.5 35.3 50 38.5C51.5 35.3 55 33 59 33C64.6 33 70 37.5 70 44.5C70 59 50 71 50 71Z" fill="#FFF6F0"/>
    </svg>
    <h1>הפקה</h1>
    <div class="sub">ברונט &amp; גיא</div>
    <form id="lockForm" autocomplete="off">
      <input id="pw" type="password" inputmode="text" autocapitalize="characters"
             placeholder="הקלידו סיסמה" aria-label="סיסמה" />
      <button type="submit">כניסה</button>
      <div class="err" id="err"></div>
    </form>
  </div>

  <!-- APP -->
  <div class="app" id="app">
    <div class="topbar">
      <div class="title">החתונה של ברונט וגיא</div>
      <div class="title-sub">29 ביולי 2026 · בון בון, תל אביב · 19:30 תחילת אירוע</div>
      <div class="tabs">
        <button id="tab-sched" class="active" type="button">לו״ז</button>
        <button id="tab-suppliers" type="button">ספקים</button>
        <button id="tab-family" type="button">משפחה</button>
      </div>
    </div>

    <section class="view" id="view-sched">
      <div class="subbar">
        <div class="helper">סננו לפי ספק כדי לראות רק את מה שרלוונטי לכם</div>
        <div class="chips" id="chips"></div>
      </div>
      <div class="list" id="sched-list"></div>
    </section>

    <section class="view" id="view-suppliers" style="display:none">
      <div class="subbar">
        <input class="search" id="search" type="search" placeholder="חיפוש ספק, קטגוריה או איש קשר…" aria-label="חיפוש" />
      </div>
      <div class="list" id="suppliers-list"></div>
    </section>

    <section class="view" id="view-family" style="display:none">
      <div class="list" id="family-list" style="padding-top:0.8rem"></div>
    </section>
  </div>

    const $ = (id) => document.getElementById(id);
    const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) => (
      { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

    let DATA = null;
    let activeVendor = localStorage.getItem("hafaka_vendor") || "all";

    /* ---------- crypto ---------- */
    async function decrypt(password, p) {
      const b64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
      const salt = b64(p.salt), iv = b64(p.iv), ct = b64(p.ct);
      const baseKey = await crypto.subtle.importKey(
        "raw", new TextEncoder().encode(password), "PBKDF2", false, ["deriveKey"]);
      const key = await crypto.subtle.deriveKey(
        { name: "PBKDF2", salt, iterations: p.iter || 200000, hash: "SHA-256" },
        baseKey, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
      const buf = await crypto.subtle.decrypt({ name: "AES-GCM", iv }, key, ct);
      return JSON.parse(new TextDecoder().decode(buf));
    }

    /* ---------- unlock flow ---------- */
    async function unlock(password) {
      const data = await decrypt(password, PAYLOAD); // throws on wrong password
      DATA = data;
      try { sessionStorage.setItem("hafaka_data", JSON.stringify(data)); } catch (e) {}
      showApp();
    }

    function showApp() {
      $("lock").classList.add("hidden");
      $("app").classList.add("show");
      renderChips();
      renderSchedule();
      renderSuppliers();
      renderFamily();
    }

    $("lockForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const pw = $("pw").value.trim();
      $("err").textContent = "";
      if (!pw) return;
      try {
        await unlock(pw);
      } catch (err) {
        $("err").textContent = "סיסמה שגויה, נסו שוב";
        $("pw").value = "";
        $("pw").focus();
      }
    });

    /* ---------- tabs ---------- */
    const VIEWS = { sched: "view-sched", suppliers: "view-suppliers", family: "view-family" };
    const TABS = { sched: "tab-sched", suppliers: "tab-suppliers", family: "tab-family" };
    function switchTab(which) {
      Object.keys(VIEWS).forEach((k) => {
        $(VIEWS[k]).style.display = k === which ? "" : "none";
        $(TABS[k]).classList.toggle("active", k === which);
      });
      localStorage.setItem("hafaka_tab", which);
      window.scrollTo(0, 0);
    }
    $("tab-sched").addEventListener("click", () => switchTab("sched"));
    $("tab-suppliers").addEventListener("click", () => switchTab("suppliers"));
    $("tab-family").addEventListener("click", () => switchTab("family"));

    /* ---------- schedule ---------- */
    function vendorLabel(key) {
      const v = (DATA.suppliers || []).find((s) => s.key === key);
      return v || { key, role: "", name: key };
    }

    function renderChips() {
      const chips = [{ key: "all", role: "", name: "הכל" }].concat(DATA.suppliers || []);
      $("chips").innerHTML = chips.map((c) => {
        const active = c.key === activeVendor ? " active" : "";
        const label = c.key === "all"
          ? "הכל"
          : `<span class="role">${esc(c.role)}</span> · ${esc(c.name)}`;
        return `<button class="chip${active}" data-key="${esc(c.key)}">${label}</button>`;
      }).join("");
      $("chips").querySelectorAll(".chip").forEach((b) => {
        b.addEventListener("click", () => {
          activeVendor = b.dataset.key;
          localStorage.setItem("hafaka_vendor", activeVendor);
          renderChips();
          renderSchedule();
        });
      });
    }

    function renderNotes(notes, mineKey) {
      // Split "[name] text [name] text" into per-vendor segments.
      const parts = [];
      const re = /\[([^\]]+)\]\s*([^\[]*)/g;
      let m, matched = false;
      while ((m = re.exec(notes))) {
        matched = true;
        parts.push({ who: m[1].trim(), text: m[2].trim() });
      }
      if (!matched) return `<div class="ev-notes"><div class="n">${esc(notes)}</div></div>`;
      const mineName = mineKey && mineKey !== "all" ? vendorLabel(mineKey).key : null;
      const html = parts.map((p) => {
        const mine = mineName && p.who.indexOf(mineName) !== -1 ? " mine" : "";
        return `<div class="n${mine}"><span class="who">${esc(p.who)}:</span> ${esc(p.text)}</div>`;
      }).join("");
      return `<div class="ev-notes">${html}</div>`;
    }

    function renderSchedule() {
      const rows = (DATA.schedule || []).filter((r) =>
        activeVendor === "all" ? true : (r.suppliers || []).indexOf(activeVendor) !== -1);
      if (!rows.length) {
        $("sched-list").innerHTML = `<div class="empty">אין פריטים לספק זה</div>`;
        return;
      }
      $("sched-list").innerHTML = rows.map((r) => {
        const time = r.time
          ? `<div class="ev-time">${esc(r.time)}</div>`
          : `<div class="ev-time pre">לפני<br>האירוע</div>`;
        let subHtml = "";
        if (r.location) subHtml += `<div class="ev-sub">📍 ${esc(r.location)}</div>`;
        if (r.who) subHtml += `<div class="ev-sub">👥 ${esc(r.who)}</div>`;
        const vendors = (r.suppliers || []).map((k) => {
          const v = vendorLabel(k);
          const hit = k === activeVendor ? " hit" : "";
          const txt = v.role ? `${v.role} · ${v.name}` : v.name;
          return `<span class="vtag${hit}" data-key="${esc(k)}" role="button" tabindex="0">${esc(txt)}</span>`;
        }).join("");
        const notes = r.notes ? renderNotes(r.notes, activeVendor) : "";
        return `<div class="ev">
          <div class="ev-head">
            ${time}
            <div class="ev-main">
              <div class="ev-title">${esc(r.activity)}</div>
              ${subHtml}
            </div>
          </div>
          ${vendors ? `<div class="ev-vendors">${vendors}</div>` : ""}
          ${notes}
        </div>`;
      }).join("");
    }

    /* ---------- contacts (suppliers + family) ---------- */
    function waLink(phone) {
      const digits = phone.replace(/\D/g, "");
      if (!/^05\d{8}$/.test(digits)) return null; // WhatsApp only for IL mobile
      return "https://wa.me/972" + digits.slice(1);
    }

    // contact name bold on top; company/venue below (hidden for family or when identical)
    function contactCard(c, family) {
      const contact = c.contact || c.supplier || "";
      const company = (!family && c.supplier && c.supplier !== contact) ? c.supplier : "";
      const tel = c.phone ? c.phone.replace(/\s/g, "") : "";
      const wa = c.phone ? waLink(c.phone) : null;
      let actions;
      if (tel) {
        actions = `<div class="actions">
          <a class="btn btn-call" href="tel:${esc(tel)}">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6.6 10.8c1.4 2.8 3.8 5.1 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1C10.4 21 3 13.6 3 4c0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.2.2 2.4.6 3.6.1.4 0 .8-.3 1.1l-2.2 2.1z"/></svg>
            התקשרו
          </a>
          ${wa ? `<a class="btn btn-wa" href="${esc(wa)}" target="_blank" rel="noopener">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a10 10 0 0 0-8.5 15.3L2 22l4.8-1.5A10 10 0 1 0 12 2zm0 18a8 8 0 0 1-4.1-1.1l-.3-.2-2.9.8.8-2.8-.2-.3A8 8 0 1 1 12 20zm4.4-6c-.2-.1-1.4-.7-1.6-.8-.2-.1-.4-.1-.5.1-.2.2-.6.8-.8 1-.1.1-.3.2-.5 0-.2-.1-1-.4-1.9-1.2-.7-.6-1.2-1.4-1.3-1.6-.1-.2 0-.4.1-.5l.4-.4c.1-.1.2-.3.2-.4 0-.1 0-.3-.1-.4l-.7-1.7c-.2-.5-.4-.4-.5-.4h-.5c-.2 0-.4.1-.6.3-.2.2-.8.8-.8 1.9s.8 2.2 1 2.4c.1.2 1.7 2.6 4 3.5 1.5.6 2 .6 2.8.5.5-.1 1.4-.6 1.6-1.1.2-.6.2-1 .1-1.1-.1-.1-.2-.2-.4-.3z"/></svg>
            וואטסאפ
          </a>` : ""}
        </div>`;
      } else {
        actions = `<div class="none">טרם עודכן מספר</div>`;
      }
      const isMgr = !family && /מנהל/.test(c.contact || "");
      return `<div class="card${isMgr ? " manager" : ""}" data-supplier="${esc(c.supplier)}">
        ${isMgr ? `<div class="mgr-badge">⭐ מנהל האירוע</div>` : ""}
        <div class="sup">${esc(contact)}</div>
        ${company ? `<div class="who">${esc(company)}</div>` : ""}
        ${actions}
      </div>`;
    }

    function renderSuppliers(query) {
      const q = (query || "").trim().toLowerCase();
      let list = (DATA.contacts || []).filter((c) => c.category !== "זוג");
      if (q) list = list.filter((c) =>
        [c.category, c.supplier, c.contact].join(" ").toLowerCase().indexOf(q) !== -1);
      if (!list.length) { $("suppliers-list").innerHTML = `<div class="empty">לא נמצאו תוצאות</div>`; return; }
      let html = "", lastCat = null;
      list.forEach((c) => {
        if (c.category !== lastCat) { html += `<div class="cat-h">${esc(c.category)}</div>`; lastCat = c.category; }
        html += contactCard(c, false);
      });
      $("suppliers-list").innerHTML = html;
    }

    function renderFamily() {
      const fam = (DATA.contacts || []).filter((c) => c.category === "זוג");
      const isCouple = (c) => c.supplier === "חתן" || c.supplier === "כלה";
      const couple = fam.filter(isCouple);
      const rels = fam.filter((c) => !isCouple(c));
      let html = "";
      if (couple.length) { html += `<div class="cat-h">הזוג</div>`; couple.forEach((c) => (html += contactCard(c, true))); }
      if (rels.length) { html += `<div class="cat-h">משפחה</div>`; rels.forEach((c) => (html += contactCard(c, true))); }
      $("family-list").innerHTML = html || `<div class="empty">—</div>`;
    }
    $("search").addEventListener("input", (e) => renderSuppliers(e.target.value));

    // Tapping a vendor tag on a schedule card jumps to that contact in ספקים.
    function gotoContact(key) {
      const name = vendorLabel(key).name;
      switchTab("suppliers");
      const s = $("search");
      if (s.value) { s.value = ""; renderSuppliers(); }
      setTimeout(() => {
        const card = [...document.querySelectorAll("#suppliers-list .card")]
          .find((c) => c.dataset.supplier === name);
        if (card) {
          card.scrollIntoView({ behavior: "smooth", block: "center" });
          card.classList.remove("flash");
          void card.offsetWidth;
          card.classList.add("flash");
        }
      }, 60);
    }
    $("sched-list").addEventListener("click", (e) => {
      const tag = e.target.closest(".vtag[data-key]");
      if (tag) gotoContact(tag.dataset.key);
    });

    /* ---------- boot: restore session if already unlocked ---------- */
    (function boot() {
      let cached = null;
      try { cached = sessionStorage.getItem("hafaka_data"); } catch (e) {}
      if (cached) {
        try {
          DATA = JSON.parse(cached);
          showApp();
          const t = localStorage.getItem("hafaka_tab");
          if (t === "suppliers" || t === "family") switchTab(t);
          return;
        } catch (e) {}
      }
      $("pw").focus();
    })();
  </script>
</body>
</html>
